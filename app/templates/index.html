<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatboton — AI tool development playground</title>
    <style>
        :root {
            --bg: #16100e;
            --panel: #221713;
            --border: #4a2c1f;
            --text: #f3e9dc;
            --muted: #b0977f;
            --accent: #e2703a;
            --accent-soft: #f0a06a;
            --danger: #c0392b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 0.8rem 1.2rem;
            background: var(--panel);
            border-bottom: 2px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        header h1 { margin: 0; font-size: 1.15rem; letter-spacing: 0.06em; color: var(--accent-soft); }
        header .sub { color: var(--muted); font-size: 0.8rem; flex: 1; }
        nav { display: flex; gap: 0.4rem; }
        nav button {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            padding: 0.4rem 1rem;
            cursor: pointer;
            font: inherit;
        }
        nav button.active {
            border-color: var(--accent);
            color: var(--accent-soft);
            font-weight: 600;
        }
        #reset-btn {
            background: transparent;
            border: 1px solid var(--danger);
            border-radius: 8px;
            color: #ff8a7a;
            padding: 0.4rem 1rem;
            cursor: pointer;
            font: inherit;
        }
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .view { flex: 1; display: none; flex-direction: column; overflow: hidden; }
        .view.active { display: flex; }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .msg {
            max-width: 72%;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: var(--accent);
            color: #1d0e05;
            border-bottom-right-radius: 4px;
        }
        .msg.assistant {
            align-self: flex-start;
            background: var(--panel);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .msg.tool {
            align-self: flex-start;
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--muted);
            font-size: 0.8rem;
        }
        .msg.error { border-color: var(--danger); color: #ff8a7a; }
        .msg pre {
            background: #0f0a08;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.7rem;
            overflow-x: auto;
            white-space: pre;
        }
        form {
            display: flex;
            gap: 0.6rem;
            padding: 0.9rem 1.2rem;
            background: var(--panel);
            border-top: 1px solid var(--border);
        }
        textarea {
            flex: 1;
            resize: none;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 0.6rem 0.8rem;
            font: inherit;
            min-height: 3.2rem;
        }
        textarea:focus { outline: 1px solid var(--accent); }
        form button {
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: #1d0e05;
            font-weight: 600;
            padding: 0 1.4rem;
            cursor: pointer;
        }
        form button:disabled { opacity: 0.5; cursor: wait; }
        /* Tool log view */
        #log-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.2rem;
            border-bottom: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.85rem;
        }
        #log-toolbar button {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            padding: 0.3rem 0.9rem;
            cursor: pointer;
            font: inherit;
        }
        #log-entries { flex: 1; overflow-y: auto; padding: 1rem 1.2rem; }
        .log-entry {
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            background: var(--panel);
            margin-bottom: 0.7rem;
            padding: 0.6rem 0.9rem;
            font-size: 0.85rem;
        }
        .log-entry .head { display: flex; gap: 0.8rem; align-items: baseline; }
        .log-entry .tool-name { color: var(--accent-soft); font-weight: 600; }
        .log-entry .time { color: var(--muted); font-size: 0.75rem; }
        .log-entry pre {
            background: #0f0a08;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem;
            overflow-x: auto;
            margin: 0.4rem 0 0;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log-empty { color: var(--muted); padding: 2rem; text-align: center; }
    </style>
</head>
<body>
    <header>
        <h1>CHATBOTON</h1>
        <span class="sub">{{ provider }} · {{ model_name }} · postgres + neo4j + chroma + qdrant + opensearch tools</span>
        <nav>
            <button id="tab-chat" class="active">Chat</button>
            <button id="tab-log">Tool Log</button>
        </nav>
        <button id="reset-btn" title="Clears the conversation only — the tool log stays">Reset conversation</button>
    </header>
    <main>
        <section id="view-chat" class="view active">
            <div id="chat"></div>
            <form id="chat-form">
                <textarea id="input" placeholder="Ask about products, customers, purchases, or reviews… (Enter to send, Shift+Enter for newline)"></textarea>
                <button id="send" type="submit">Send</button>
            </form>
        </section>
        <section id="view-log" class="view">
            <div id="log-toolbar">
                <span id="log-count">0 tool invocations this server session</span>
                <button id="clear-log">Clear log</button>
            </div>
            <div id="log-entries"></div>
        </section>
    </main>
    <script>
        const chatEl = document.getElementById("chat");
        const form = document.getElementById("chat-form");
        const input = document.getElementById("input");
        const sendBtn = document.getElementById("send");
        const history = [];

        // --- Tab switching: pure show/hide, so chat history is never lost ---
        const tabs = { chat: document.getElementById("tab-chat"), log: document.getElementById("tab-log") };
        const views = { chat: document.getElementById("view-chat"), log: document.getElementById("view-log") };
        function showView(name) {
            for (const key of Object.keys(views)) {
                views[key].classList.toggle("active", key === name);
                tabs[key].classList.toggle("active", key === name);
            }
            if (name === "log") refreshLog();
            if (name === "chat") input.focus();
        }
        tabs.chat.addEventListener("click", () => showView("chat"));
        tabs.log.addEventListener("click", () => showView("log"));

        // --- Reset conversation (chat only; the tool log has its own button) ---
        document.getElementById("reset-btn").addEventListener("click", () => {
            history.length = 0;
            chatEl.innerHTML = "";
            input.focus();
        });

        // --- Tool log view ---
        async function refreshLog() {
            const res = await fetch("/api/tool_log");
            const data = await res.json();
            const entries = data.entries || [];
            document.getElementById("log-count").textContent =
                entries.length + " tool invocation" + (entries.length === 1 ? "" : "s") + " this server session";
            const container = document.getElementById("log-entries");
            container.innerHTML = "";
            if (!entries.length) {
                const empty = document.createElement("div");
                empty.className = "log-empty";
                empty.textContent = "No tool invocations yet — ask the agent something about the databases.";
                container.appendChild(empty);
                return;
            }
            for (const entry of entries.slice().reverse()) {
                const div = document.createElement("div");
                div.className = "log-entry";
                const head = document.createElement("div");
                head.className = "head";
                const name = document.createElement("span");
                name.className = "tool-name";
                name.textContent = entry.tool;
                const time = document.createElement("span");
                time.className = "time";
                time.textContent = entry.timestamp;
                head.append(name, time);
                const args = document.createElement("pre");
                args.textContent = "args: " + JSON.stringify(entry.args, null, 2);
                const result = document.createElement("pre");
                result.textContent = "result: " + (entry.result === null ? "(none)" : entry.result);
                div.append(head, args, result);
                container.appendChild(div);
            }
        }
        document.getElementById("clear-log").addEventListener("click", async () => {
            await fetch("/api/tool_log/clear", { method: "POST" });
            refreshLog();
        });

        // --- Chat ---
        function renderContent(el, text) {
            // Render ```code``` blocks as <pre>, everything else as text nodes.
            const parts = String(text).split(/```(?:\w+)?\n?/);
            parts.forEach((part, i) => {
                if (i % 2 === 1) {
                    const pre = document.createElement("pre");
                    pre.textContent = part;
                    el.appendChild(pre);
                } else if (part) {
                    el.appendChild(document.createTextNode(part));
                }
            });
        }

        function addMessage(role, text) {
            const div = document.createElement("div");
            div.className = "msg " + role;
            renderContent(div, text);
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
            return div;
        }

        async function send() {
            const text = input.value.trim();
            if (!text || sendBtn.disabled) return;
            input.value = "";
            addMessage("user", text);
            history.push({ role: "user", content: text });

            sendBtn.disabled = true;
            const pending = addMessage("assistant", "…thinking (local model on CPU)");
            const startedAt = Date.now();
            const ticker = setInterval(() => {
                const s = Math.round((Date.now() - startedAt) / 1000);
                pending.textContent = "…thinking for " + s + "s (local model on CPU)";
            }, 1000);
            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: history }),
                });
                const data = await res.json();
                pending.remove();
                if (!res.ok) {
                    addMessage("assistant error", "Error: " + (data.error || res.statusText));
                    history.pop();
                    return;
                }
                for (const t of data.tool_activity || []) {
                    let note = "🔧 " + t.tool + "(" + JSON.stringify(t.args).slice(0, 300) + ")";
                    if (t.result) note += "\n↳ " + String(t.result).slice(0, 300);
                    addMessage("tool", note);
                }
                addMessage("assistant", data.reply);
                history.push({ role: "assistant", content: data.reply });
            } catch (err) {
                pending.remove();
                addMessage("assistant error", "Request failed: " + err);
                history.pop();
            } finally {
                clearInterval(ticker);
                sendBtn.disabled = false;
                input.focus();
            }
        }

        form.addEventListener("submit", (e) => { e.preventDefault(); send(); });
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
        });
        input.focus();
    </script>
</body>
</html>
