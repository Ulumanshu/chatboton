# Chatboton playground infrastructure — one database of each LangChain "lego" flavor.
# Start with: docker compose up -d
# Postgres is seeded automatically on first boot (docker/postgres-init/).
# Seed Neo4j and Chroma afterwards with: python scripts/seed.py
services:
  postgres:
    image: postgres:16-alpine
    container_name: chatboton_postgres
    environment:
      POSTGRES_USER: chatboton
      POSTGRES_PASSWORD: chatboton
      POSTGRES_DB: chatboton
    ports:
      - "55433:5432"
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatboton -d chatboton"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5-community
    container_name: chatboton_neo4j
    environment:
      NEO4J_AUTH: neo4j/chatboton_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "57475:7474"
      - "57688:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  chroma:
    image: chromadb/chroma:latest
    container_name: chatboton_chroma
    ports:
      - "58001:8000"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatboton_qdrant
    ports:
      - "58333:6333"
      - "58334:6334"

  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: chatboton_opensearch
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "59200:9200"
      - "59600:9600"
